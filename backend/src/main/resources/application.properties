# =========================================
# TeleHealth Pro Backend - application.properties
# Default (dev) profile. Every value can be overridden by an environment
# variable of the same name in ${...} for zero-code-change deployment.
# =========================================

# Server
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# Application Name
spring.application.name=TeleHealthProBackend

# ---------- MySQL Database ----------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/telehealth_pro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- CORS ----------
# Comma-separated list of origins allowed to call this API.
# Update this if you serve the frontend from a different port/tool
# (e.g. VS Code Live Server usually uses 5500).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5501,http://localhost:3000,http://localhost:8081}

# ---------- Session Cookie ----------
# Left at browser defaults for local dev (works fine for localhost:5500 <-> localhost:8080).
# See application-prod.properties for the cross-domain deployment settings.
server.servlet.session.cookie.same-site=lax

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.telehealthpro=DEBUG
