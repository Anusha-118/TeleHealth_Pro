# =========================================
# TeleHealth Pro Backend - application-prod.properties
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Use this profile whenever the frontend and backend are deployed on
# DIFFERENT domains (e.g. frontend on Netlify, backend on Render). In that
# situation the browser treats them as fully cross-site, and a session
# cookie with the default SameSite=Lax will NOT be sent on fetch() calls
# from the frontend. Cross-site cookies require SameSite=None, and browsers
# only honor SameSite=None when the cookie is also marked Secure (HTTPS
# only) - which is why this profile assumes both apps are served over
# HTTPS, as they will be by default on virtually every hosting platform.
# =========================================

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Trust the platform's reverse proxy (Render/Railway/etc.) so Spring knows
# the original request was HTTPS even though it terminates TLS upstream.
server.forward-headers-strategy=native

# Reduce noisy logging in production
logging.level.org.springframework.security=WARN
logging.level.com.telehealthpro=INFO
spring.jpa.show-sql=false
