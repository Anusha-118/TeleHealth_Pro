<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Doctor - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">
            <i class="bi bi-heart-pulse-fill me-2"></i>TeleHealth<span class="text-dark">Pro</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
                <li class="nav-item nav-user-link d-none"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
                <li class="nav-item nav-guest-link"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item nav-guest-link"><a class="btn btn-primary rounded-pill px-4" href="register.html">Register</a></li>
                <li class="nav-item nav-user-link d-none"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item nav-admin-link d-none"><a class="nav-link" href="admin/dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Admin Panel</a></li>
                <li class="nav-item nav-auth-link d-none"><button id="logoutBtn" class="btn btn-outline-primary rounded-pill px-4">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">Find a Doctor</h2>

    <form id="filterForm" class="card p-3 mb-4 shadow-sm border-0">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small">Search by Name</label>
                <input type="text" id="searchName" class="form-control" placeholder="Doctor name...">
            </div>
            <div class="col-md-3">
                <label class="form-label small">Category</label>
                <select id="filterCategory" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Availability</label>
                <select id="filterAvailability" class="form-select">
                    <option value="">All</option>
                    <option value="Available">Available</option>
                    <option value="Busy">Busy</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Search</button>
            </div>
        </div>
    </form>

    <div id="doctorsContainer" class="row g-4">
        <div class="col-12 text-secondary py-3">Loading doctors...</div>
    </div>
</div>

<footer class="bg-dark text-light pt-4 pb-4 mt-5">
    <p class="text-center text-secondary mb-0">&copy; 2026 TeleHealth Pro. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    function renderDoctors(doctors) {
        const container = document.getElementById("doctorsContainer");
        if (!doctors.length) {
            container.innerHTML = '<div class="col-12"><p class="text-center text-secondary py-5">No doctors found matching your criteria.</p></div>';
            return;
        }
        container.innerHTML = doctors.map(doc => `
            <div class="col-lg-4 col-md-6">
                <div class="card doctor-card h-100">
                    <img src="${doc.photo || 'images/doctor-placeholder.png'}"
                         alt="Doctor photo" onerror="this.onerror=null;this.src='images/doctor-placeholder.png';">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="fw-bold mb-1">${doc.doctorName}</h5>
                            <span class="badge ${doc.availability === 'Available' ? 'badge-available' : 'badge-busy'}">${doc.availability}</span>
                        </div>
                        <p class="text-primary-blue fw-semibold mb-1">${doc.specialization}</p>
                        <p class="text-secondary small mb-1">${doc.qualification}</p>
                        <p class="text-secondary small mb-1"><i class="bi bi-hospital me-1"></i>${doc.hospital}</p>
                        <p class="text-secondary small mb-1"><i class="bi bi-briefcase me-1"></i>${doc.experience} years experience</p>
                        <p class="text-secondary small mb-1"><i class="bi bi-calendar-week me-1"></i>${doc.availableDays}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fw-bold">$${doc.consultationFee}</span>
                            <span class="text-warning"><i class="bi bi-star-fill"></i> ${doc.rating}</span>
                        </div>
                        <a href="book-appointment.html?doctorId=${doc.id}" class="btn btn-primary w-100 mt-3">Book Appointment</a>
                    </div>
                </div>
            </div>
        `).join("");
    }

    async function loadCategories() {
        const select = document.getElementById("filterCategory");
        try {
            const categories = await Api.getCategories();
            categories.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.id;
                opt.textContent = cat.categoryName;
                select.appendChild(opt);
            });
            const preselect = urlParams.get("categoryId");
            if (preselect) select.value = preselect;
        } catch (e) { /* leave just "All Categories" */ }
    }

    async function loadDoctors() {
        const container = document.getElementById("doctorsContainer");
        container.innerHTML = '<div class="col-12 text-secondary py-3">Loading doctors...</div>';
        const params = {};
        const name = document.getElementById("searchName").value.trim();
        const categoryId = document.getElementById("filterCategory").value;
        const availability = document.getElementById("filterAvailability").value;
        if (name) params.name = name;
        if (categoryId) params.categoryId = categoryId;
        if (availability) params.availability = availability;

        try {
            const doctors = await Api.getDoctors(params);
            renderDoctors(doctors);
        } catch (e) {
            container.innerHTML = '<div class="col-12 text-danger py-3">Could not load doctors. Is the backend running?</div>';
        }
    }

    document.getElementById("filterForm").addEventListener("submit", (e) => {
        e.preventDefault();
        loadDoctors();
    });

    (async () => {
        await loadCategories();
        await loadDoctors();
    })();
</script>
</body>
</html>
