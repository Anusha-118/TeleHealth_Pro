<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <div class="admin-sidebar bg-dark text-light p-3 vh-100">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-light">
            <i class="bi bi-heart-pulse-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold">TeleHealth<span class="text-primary">Admin</span></span>
        </a>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-light active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="doctors.html"><i class="bi bi-person-badge me-2"></i>Doctors</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="categories.html"><i class="bi bi-grid-3x3-gap me-2"></i>Categories</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="users.html"><i class="bi bi-people me-2"></i>Registered Users</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="appointments.html"><i class="bi bi-calendar-check me-2"></i>Appointments</a></li>
            <li class="nav-item mt-3"><button id="logoutBtn" class="nav-link text-light border-0 bg-transparent w-100 text-start"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold mb-4">Admin Dashboard</h2>

        <div id="statsRow" class="row g-4">
            <div class="col-12 text-secondary py-3">Loading stats...</div>
        </div>

        <div class="row g-4 mt-2">
            <div class="col-md-3"><a href="add-doctor.html" class="btn btn-primary w-100 py-3"><i class="bi bi-plus-circle me-2"></i>Add Doctor</a></div>
            <div class="col-md-3"><a href="categories.html" class="btn btn-outline-primary w-100 py-3"><i class="bi bi-grid me-2"></i>Manage Categories</a></div>
            <div class="col-md-3"><a href="appointments.html" class="btn btn-outline-primary w-100 py-3"><i class="bi bi-calendar-check me-2"></i>View Appointments</a></div>
            <div class="col-md-3"><a href="users.html" class="btn btn-outline-primary w-100 py-3"><i class="bi bi-people me-2"></i>View Users</a></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    async function init() {
        const user = await requireAdmin();
        if (!user) return;

        try {
            const stats = await Api.admin.stats();
            document.getElementById("statsRow").innerHTML = `
                <div class="col-lg-3 col-md-6"><div class="stat-card blue"><i class="bi bi-people fs-2"></i><h3 class="fw-bold mt-2 mb-0">${stats.totalUsers}</h3><p class="mb-0">Total Users</p></div></div>
                <div class="col-lg-3 col-md-6"><div class="stat-card green"><i class="bi bi-person-badge fs-2"></i><h3 class="fw-bold mt-2 mb-0">${stats.totalDoctors}</h3><p class="mb-0">Total Doctors</p></div></div>
                <div class="col-lg-3 col-md-6"><div class="stat-card orange"><i class="bi bi-grid-3x3-gap fs-2"></i><h3 class="fw-bold mt-2 mb-0">${stats.totalCategories}</h3><p class="mb-0">Total Categories</p></div></div>
                <div class="col-lg-3 col-md-6"><div class="stat-card purple"><i class="bi bi-calendar-check fs-2"></i><h3 class="fw-bold mt-2 mb-0">${stats.totalAppointments}</h3><p class="mb-0">Total Appointments</p></div></div>
                <div class="col-lg-3 col-md-6"><div class="stat-card teal"><i class="bi bi-calendar-day fs-2"></i><h3 class="fw-bold mt-2 mb-0">${stats.todaysAppointments}</h3><p class="mb-0">Today's Appointments</p></div></div>
            `;
        } catch (e) {
            document.getElementById("statsRow").innerHTML = '<div class="col-12 text-danger py-3">Could not load stats.</div>';
        }
    }
    init();
</script>
</body>
</html>
