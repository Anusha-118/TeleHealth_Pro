<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <div class="admin-sidebar bg-dark text-light p-3 vh-100">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-light">
            <i class="bi bi-heart-pulse-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold">TeleHealth<span class="text-primary">Admin</span></span>
        </a>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-light" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="doctors.html"><i class="bi bi-person-badge me-2"></i>Doctors</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="categories.html"><i class="bi bi-grid-3x3-gap me-2"></i>Categories</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="users.html"><i class="bi bi-people me-2"></i>Registered Users</a></li>
            <li class="nav-item"><a class="nav-link text-light active" href="appointments.html"><i class="bi bi-calendar-check me-2"></i>Appointments</a></li>
            <li class="nav-item mt-3"><button id="logoutBtn" class="nav-link text-light border-0 bg-transparent w-100 text-start"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold mb-4">Manage Appointments</h2>

        <div id="alertContainer"></div>

        <div class="table-responsive">
            <table class="table table-hover bg-white align-middle">
                <thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Change Status</th></tr></thead>
                <tbody id="appointmentsBody">
                    <tr><td colspan="6" class="text-center text-secondary py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    const statusBadgeClass = (status) => ({
        Approved: "bg-success", Cancelled: "bg-danger", Completed: "bg-secondary", Pending: "bg-warning text-dark"
    }[status] || "bg-warning text-dark");

    const statuses = ["Pending", "Approved", "Cancelled", "Completed"];

    async function loadAppointments() {
        const tbody = document.getElementById("appointmentsBody");
        try {
            const appointments = await Api.admin.listAppointments();
            if (!appointments.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">No appointments found.</td></tr>';
                return;
            }
            tbody.innerHTML = appointments.map(a => `
                <tr>
                    <td>${a.userFullName}</td>
                    <td>${a.doctorName}</td>
                    <td>${a.appointmentDate}</td>
                    <td>${a.appointmentTime}</td>
                    <td><span class="badge ${statusBadgeClass(a.status)}">${a.status}</span></td>
                    <td>
                        <div class="d-flex gap-2">
                            <select class="form-select form-select-sm" style="width:auto;" id="status-${a.id}">
                                ${statuses.map(s => `<option value="${s}" ${s === a.status ? "selected" : ""}>${s}</option>`).join("")}
                            </select>
                            <button class="btn btn-sm btn-primary" onclick="updateStatus(${a.id})">Update</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Could not load appointments.</td></tr>';
        }
    }

    async function updateStatus(id) {
        const status = document.getElementById(`status-${id}`).value;
        try {
            await Api.admin.updateAppointmentStatus(id, status);
            loadAppointments();
        } catch (e) {
            showAlert("alertContainer", e.message);
        }
    }

    (async () => {
        const user = await requireAdmin();
        if (!user) return;
        loadAppointments();
    })();
</script>
</body>
</html>
