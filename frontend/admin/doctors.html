<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <div class="admin-sidebar bg-dark text-light p-3 vh-100">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-light">
            <i class="bi bi-heart-pulse-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold">TeleHealth<span class="text-primary">Admin</span></span>
        </a>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-light" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light active" href="doctors.html"><i class="bi bi-person-badge me-2"></i>Doctors</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="categories.html"><i class="bi bi-grid-3x3-gap me-2"></i>Categories</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="users.html"><i class="bi bi-people me-2"></i>Registered Users</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="appointments.html"><i class="bi bi-calendar-check me-2"></i>Appointments</a></li>
            <li class="nav-item mt-3"><button id="logoutBtn" class="nav-link text-light border-0 bg-transparent w-100 text-start"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Manage Doctors</h2>
            <a href="add-doctor.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Add Doctor</a>
        </div>

        <div id="alertContainer"></div>

        <div class="table-responsive">
            <table class="table table-hover bg-white align-middle">
                <thead>
                    <tr><th>Photo</th><th>Name</th><th>Category</th><th>Hospital</th><th>Fee</th><th>Rating</th><th>Availability</th><th>Actions</th></tr>
                </thead>
                <tbody id="doctorsBody">
                    <tr><td colspan="8" class="text-center text-secondary py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    async function loadDoctors() {
        const tbody = document.getElementById("doctorsBody");
        try {
            const doctors = await Api.admin.listDoctors();
            if (!doctors.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary py-4">No doctors added yet.</td></tr>';
                return;
            }
            tbody.innerHTML = doctors.map(doc => `
                <tr>
                    <td><img src="${doc.photo || '../images/doctor-placeholder.png'}" style="width:45px;height:45px;object-fit:cover;border-radius:50%;" onerror="this.onerror=null;this.src='../images/doctor-placeholder.png';" alt="photo"></td>
                    <td>${doc.doctorName}</td>
                    <td>${doc.categoryName}</td>
                    <td>${doc.hospital}</td>
                    <td>$${doc.consultationFee}</td>
                    <td>${doc.rating}</td>
                    <td><span class="badge ${doc.availability === 'Available' ? 'badge-available' : 'badge-busy'}">${doc.availability}</span></td>
                    <td>
                        <a href="edit-doctor.html?id=${doc.id}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteDoctor(${doc.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join("");
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Could not load doctors.</td></tr>';
        }
    }

    async function deleteDoctor(id) {
        if (!confirm("Delete this doctor?")) return;
        try {
            await Api.admin.deleteDoctor(id);
            loadDoctors();
        } catch (e) {
            showAlert("alertContainer", e.message);
        }
    }

    (async () => {
        const user = await requireAdmin();
        if (!user) return;
        loadDoctors();
    })();
</script>
</body>
</html>
