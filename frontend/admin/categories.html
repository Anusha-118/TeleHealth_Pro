<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <div class="admin-sidebar bg-dark text-light p-3 vh-100">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none text-light">
            <i class="bi bi-heart-pulse-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold">TeleHealth<span class="text-primary">Admin</span></span>
        </a>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-light" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="doctors.html"><i class="bi bi-person-badge me-2"></i>Doctors</a></li>
            <li class="nav-item"><a class="nav-link text-light active" href="categories.html"><i class="bi bi-grid-3x3-gap me-2"></i>Categories</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="users.html"><i class="bi bi-people me-2"></i>Registered Users</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="appointments.html"><i class="bi bi-calendar-check me-2"></i>Appointments</a></li>
            <li class="nav-item mt-3"><button id="logoutBtn" class="nav-link text-light border-0 bg-transparent w-100 text-start"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold mb-4">Manage Doctor Categories</h2>

        <div id="alertContainer"></div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0">
                    <h5 class="fw-bold mb-3">Add New Category</h5>
                    <form id="categoryForm">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" id="categoryName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Icon Class (Bootstrap Icons)</label>
                            <input type="text" id="iconClass" class="form-control" placeholder="e.g. bi-heart-pulse">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Add Category</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="table-responsive">
                    <table class="table table-hover bg-white align-middle">
                        <thead><tr><th>Icon</th><th>Category Name</th><th>Doctors</th><th>Actions</th></tr></thead>
                        <tbody id="categoriesBody">
                            <tr><td colspan="4" class="text-center text-secondary py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    async function loadCategories() {
        const tbody = document.getElementById("categoriesBody");
        try {
            const categories = await Api.admin.listCategories();
            if (!categories.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary py-4">No categories yet.</td></tr>';
                return;
            }
            tbody.innerHTML = categories.map(cat => `
                <tr>
                    <td><i class="bi ${cat.iconClass} fs-4 text-primary-blue"></i></td>
                    <td>${cat.categoryName}</td>
                    <td>${cat.availableDoctorCount}</td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${cat.id})"><i class="bi bi-trash"></i></button></td>
                </tr>
            `).join("");
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Could not load categories.</td></tr>';
        }
    }

    async function deleteCategory(id) {
        if (!confirm("Delete this category? This will remove associated doctors.")) return;
        try {
            await Api.admin.deleteCategory(id);
            loadCategories();
        } catch (e) {
            showAlert("alertContainer", e.message);
        }
    }

    document.getElementById("categoryForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const dto = {
            categoryName: document.getElementById("categoryName").value.trim(),
            iconClass: document.getElementById("iconClass").value.trim() || "bi-heart-pulse",
        };
        try {
            await Api.admin.addCategory(dto);
            document.getElementById("categoryForm").reset();
            loadCategories();
        } catch (err) {
            showAlert("alertContainer", err.message);
        }
    });

    (async () => {
        const user = await requireAdmin();
        if (!user) return;
        loadCategories();
    })();
</script>
</body>
</html>
