<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light-blue">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">
            <i class="bi bi-heart-pulse-fill me-2"></i>TeleHealth<span class="text-dark">Pro</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
                <li class="nav-item nav-user-link d-none"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item nav-admin-link d-none"><a class="nav-link" href="admin/dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Admin Panel</a></li>
                <li class="nav-item nav-auth-link d-none"><button id="logoutBtn" class="btn btn-outline-primary rounded-pill px-4">Logout</button></li>
                <li class="nav-item nav-guest-link"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item nav-guest-link"><a class="btn btn-primary rounded-pill px-4" href="register.html">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div id="alertContainer"></div>

            <div id="bookingCard" class="card shadow-sm border-0 p-4 d-none">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <img id="doctorPhoto" src="images/doctor-placeholder.png" style="width:80px;height:80px;object-fit:cover;border-radius:50%;" alt="Doctor">
                    <div>
                        <h4 class="fw-bold mb-1" id="doctorName">Dr. Name</h4>
                        <p class="text-primary-blue mb-0" id="doctorSpecialization">Specialization</p>
                        <p class="text-secondary small mb-0">
                            <span id="doctorHospital">Hospital</span> · Fee: $<span id="doctorFee">0</span>
                        </p>
                    </div>
                </div>

                <h5 class="fw-bold mb-3">Book Your Appointment</h5>
                <form id="bookingForm">
                    <div class="mb-3">
                        <label class="form-label">Select Date</label>
                        <input type="date" id="appointmentDate" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Select Time Slot</label>
                        <input type="time" id="appointmentTime" class="form-control" required>
                    </div>
                    <p class="text-secondary small">
                        <i class="bi bi-info-circle me-1"></i>Doctor is available on: <span id="doctorDays">Mon-Fri</span>
                    </p>
                    <button type="submit" class="btn btn-primary w-100 py-2">Confirm Appointment</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light pt-4 pb-4 mt-5">
    <p class="text-center text-secondary mb-0">&copy; 2026 TeleHealth Pro. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const doctorId = urlParams.get("doctorId");

    async function init() {
        const user = await requireAuth();
        if (!user) return;

        if (!doctorId) {
            showAlert("alertContainer", "No doctor selected. Please go back to the doctor list.");
            return;
        }

        try {
            const doctor = await Api.getDoctor(doctorId);
            document.getElementById("doctorPhoto").src = doctor.photo || "images/doctor-placeholder.png";
            document.getElementById("doctorName").textContent = doctor.doctorName;
            document.getElementById("doctorSpecialization").textContent = doctor.specialization;
            document.getElementById("doctorHospital").textContent = doctor.hospital;
            document.getElementById("doctorFee").textContent = doctor.consultationFee;
            document.getElementById("doctorDays").textContent = doctor.availableDays;
            document.getElementById("bookingCard").classList.remove("d-none");
        } catch (e) {
            showAlert("alertContainer", "Could not load doctor details.");
        }
    }

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const dto = {
            doctorId: Number(doctorId),
            appointmentDate: document.getElementById("appointmentDate").value,
            appointmentTime: document.getElementById("appointmentTime").value,
        };
        try {
            await Api.bookAppointment(dto);
            showAlert("alertContainer", "Appointment request submitted successfully! Status: Pending", "success");
            document.getElementById("bookingForm").reset();
            setTimeout(() => window.location.href = "dashboard.html", 1800);
        } catch (err) {
            showAlert("alertContainer", err.message);
        }
    });

    init();
</script>
</body>
</html>
