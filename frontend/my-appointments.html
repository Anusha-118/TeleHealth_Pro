<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - TeleHealth Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">
            <i class="bi bi-heart-pulse-fill me-2"></i>TeleHealth<span class="text-dark">Pro</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
                <li class="nav-item nav-user-link d-none"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item nav-admin-link d-none"><a class="nav-link" href="admin/dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Admin Panel</a></li>
                <li class="nav-item nav-auth-link d-none"><button id="logoutBtn" class="btn btn-outline-primary rounded-pill px-4">Logout</button></li>
                <li class="nav-item nav-guest-link"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item nav-guest-link"><a class="btn btn-primary rounded-pill px-4" href="register.html">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">My Appointments</h2>
    <div class="table-responsive">
        <table class="table table-hover bg-white align-middle">
            <thead>
                <tr><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Status</th></tr>
            </thead>
            <tbody id="appointmentsBody">
                <tr><td colspan="5" class="text-center text-secondary py-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="bg-dark text-light pt-4 pb-4 mt-5">
    <p class="text-center text-secondary mb-0">&copy; 2026 TeleHealth Pro. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    const statusBadgeClass = (status) => ({
        Approved: "bg-success", Cancelled: "bg-danger", Completed: "bg-secondary", Pending: "bg-warning text-dark"
    }[status] || "bg-warning text-dark");

    async function init() {
        const user = await requireAuth();
        if (!user) return;

        try {
            const appointments = await Api.myAppointments();
            const tbody = document.getElementById("appointmentsBody");
            if (!appointments.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">No appointments booked yet. <a href="doctors.html">Book one now</a>.</td></tr>';
            } else {
                tbody.innerHTML = appointments.map(a => `
                    <tr>
                        <td>${a.doctorName}</td>
                        <td>${a.doctorSpecialization}</td>
                        <td>${a.appointmentDate}</td>
                        <td>${a.appointmentTime}</td>
                        <td><span class="badge ${statusBadgeClass(a.status)}">${a.status}</span></td>
                    </tr>
                `).join("");
            }
        } catch (e) {
            document.getElementById("appointmentsBody").innerHTML =
                '<tr><td colspan="5" class="text-center text-danger py-4">Could not load appointments.</td></tr>';
        }
    }
    init();
</script>
</body>
</html>
